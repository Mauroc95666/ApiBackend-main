server {
    listen 80;
    server_name _;

    # Archivos estáticos de la SPA
    root /usr/share/nginx/html;
    index index.html;

    # Redirige las llamadas /api al contenedor del backend (.NET).
    # Se usa el DNS interno de Docker (127.0.0.11) y una variable para que
    # nginx NO falle al arrancar si el backend todavía no está listo.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cualquier otra ruta la maneja Vue (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
